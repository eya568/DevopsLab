stages:
  - build
  - test
  - deploy

build_job:
  stage: build
  script:
    - echo "Compilation du projet..."
    - echo "Build terminé avec succès."

test_job:
  stage: test
  script:
    - echo "Exécution des tests..."
    - echo "Tous les tests sont passés."

validate_files:
  stage: test
  script:
    - if [ -f fonctionnalite1.txt ] && [ -f fonctionnalite2.txt ]; then
        echo "Tous les fichiers sont présents";
      else
        echo "Un ou plusieurs fichiers sont manquants";
        exit 1;
      fi

deploy_job:
  stage: deploy
  script:
    - echo "Déploiement en cours..."
    - echo "Déploiement terminé."
